[project]
copyright = """
  <a href="https://github.com/gbr-ufs/consumo">consumo</a> © 2026 by <a href="https://github.com/gs-101">Gabriel Santos de Souza</a> is licensed under <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;">
  """
repo_url = "https://github.com/gbr-ufs/consumo"
site_author = "Gabriel Santos de Souza"
site_description = "Content Consumption Analyzer"
site_name = "consumo"
site_url = "https://gbr-ufs.github.io/consumo/"

[[project.extra.social]]
  icon = "fontawesome/brands/github"
  link = "https://github.com/gbr-ufs/consumo"

[[project.extra.social]]
  icon = "fontawesome/brands/python"
  link = "https://pypi.org/project/consumo/"

[[project.extra.social]]
  icon = "lucide/flask-conical"
  link = "https://app.codecov.io/gh/gbr-ufs/consumo"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = true

[project.theme]
# TODO: create favicon/logo.
# favicon = "images/favicon.png"
# logo = "images/logo.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.integrate",
]
font.text = "Cascadia Code"
font.code = "Cascadia Mono"
language = "en"

[[project.theme.palette]]
  media = "(prefers-color-scheme: light)"
  scheme = "default"
  toggle.icon = "lucide/sun"
  toggle.name = "Switch to dark mode"

[[project.theme.palette]]
  media = "(prefers-color-scheme: dark)"
  scheme = "slate"
  toggle.icon = "lucide/moon"
  toggle.name = "Switch to light mode"
