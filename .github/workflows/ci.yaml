name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Install macOS External Dependencies
      if: runner.os == 'macOS'
      run: |
        brew install \
        libmagic
    - name: Install Linux External Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y \
        libmagic-dev
    - name: Test
      uses: ./.github/actions/tests
    - name: Build
      uses: ./.github/actions/build
