name: Review

on:
  pull_request:
    branches:
      - main

jobs:
  review:
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Test
      uses: ./.github/actions/tests
    - name: Build
      uses: ./.github/actions/build
