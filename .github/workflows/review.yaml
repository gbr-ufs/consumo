name: Review

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - .github/actions/commitizen/action.yaml
      - .github/actions/reuse/action.yaml
      - .github/actions/tests/action.yaml
      - .github/workflows/review.yaml
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
    - name: Commitizen
      uses: ./.github/actions/commitizen
    - name: REUSE
      uses: ./.github/actions/reuse
  test:
    needs: check
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - name: Test
      uses: ./.github/actions/tests
    - name: Codecov
      uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
