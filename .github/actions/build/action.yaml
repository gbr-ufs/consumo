name: Build

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
      with:
        enable-cache: true
        version: "0.9.14"
    - name: Install Dependencies
      shell: bash
      run: uv sync --group build
    - name: Build
      shell: bash
      run: |
        pyinstaller \
        src/consumo/__main__.py \
        -F \
        -n consumo
    - name: Package artifacts
      shell: bash
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS}" = "Windows" ]; then
          EXE_PATH="dist/consumo.exe"
        else
          EXE_PATH="dist/consumo"
        fi
        export EXE_PATH
        ZIP_NAME="dist/consumo-${RUNNER_OS}.zip"
        export ZIP_NAME
        python .github/actions/build/action.py
