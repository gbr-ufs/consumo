name: Tests

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
      with:
        enable-cache: true
        version: "0.9.14"
    - name: Install Dependencies
      shell: bash
      run: uv sync --group tests
    - name: Test
      shell: bash
      run: uv run pytest
