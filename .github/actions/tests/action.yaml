name: Tests

runs:
  using: "composite"
  steps:
    - name: Install macOS External Dependencies
      shell: bash
      if: runner.os == 'macOS'
      run: |
        brew install \
        libmagic
    - name: Install Linux External Dependencies
      shell: bash
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y \
        libmagic-dev
    - name: Install uv
      uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a
      with:
        enable-cache: true
        version: "0.9.14"
    - name: Test
      shell: bash
      run: uv run --no-dev --group tests pytest
